<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT 历史传感器数据</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* 历史页面补充样式：与实时页面共享 style.css 的深色主题 */
    .nav-back {
      display: inline-block;
      margin-top: 10px;
      font-size: 14px;
      color: #4dabf7;
      text-decoration: none;
    }
    .nav-back:hover {
      text-decoration: underline;
    }
    .summary {
      max-width: 1100px;
      margin: 0 auto 16px;
      font-size: 14px;
      color: #888;
      text-align: right;
    }
    .summary strong {
      color: #e0e0e0;
    }
    .hint {
      max-width: 1100px;
      margin: 0 auto 16px;
      padding: 16px;
      border-radius: 12px;
      background: #232832;
      border: 1px solid #2e3442;
      color: #888;
      text-align: center;
    }
    .hint.error {
      color: #ff6b6b;
      border-color: #5c2b2b;
    }
  </style>
</head>
<body>
  <header>
    <h1>IoT Demo · 历史传感器数据</h1>
    <p>数据来源：SQLite 本地历史数据库（全量记录）</p>
    <a class="nav-back" href="/">← 返回实时监控页</a>
  </header>

  <div class="summary">共 <strong id="record-count">0</strong> 条历史记录</div>

  <!-- 空数据 / 加载失败提示 -->
  <div class="hint" id="hint" hidden></div>

  <section class="chart-container">
    <canvas id="history-chart"></canvas>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/history.js"></script>
</body>
</html>
